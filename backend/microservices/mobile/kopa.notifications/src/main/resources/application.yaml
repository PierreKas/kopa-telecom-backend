spring:
  application:
    name: kopa.notifications
  config:
    import: optional:file:/media/pierre-kasanani/240D8B9875FBC7EA/my_kope/kopa/backend/kopa-config.yml
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: notifications

server:
  port: 8084
  servlet:
    context-path: /kopa-notifications
  error:
    include-message: always

# kopa.db.* / spring.rabbitmq.* come from the shared kopa-config.yml above - same property names,
# no redeclaration needed. Only middleware-sms.base-url and the exchange name need remapping below.
middleware-sms:
  base-url: ${kopa.middleware.sms-base-url}
  api-key: ${kopa.internal.middleware-sms-api-key}

internal:
  api-key: ${kopa.internal.notifications-api-key}
