services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${KOPA_DB_USERNAME}
      POSTGRES_PASSWORD: ${KOPA_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - kopa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KOPA_DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stateless gateway to the real RBSS-CCBS (KTRN) system - reaching the live gateway needs the
  # VPN tunnel into Kopa's network, same as when run directly on the host (see .env comments).
  kopa-middleware-ktrn:
    build: ./middleware/kopa.middleware-ktrn
    env_file: .env
    ports:
      - "8082:8082"

  # Stateless gateway to the InTouch SMS gateway.
  kopa-middleware-sms:
    build: ./middleware/kopa.middleware-sms
    env_file: .env
    ports:
      - "8086:8086"

  kopa-notifications:
    build: ./microservices/mobile/kopa.notifications
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kopa-middleware-sms:
        condition: service_started
    ports:
      - "8084:8084"

  kopa-customer-identity:
    build: ./microservices/mobile/kopa.customer-identity
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kopa-middleware-ktrn:
        condition: service_started
      kopa-notifications:
        condition: service_started
    ports:
      - "8083:8083"

  kopa-customer-self-care:
    build: ./microservices/mobile/kopa.customer-self-care
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kopa-middleware-ktrn:
        condition: service_started
      kopa-notifications:
        condition: service_started
    ports:
      - "8081:8081"

volumes:
  kopa_pgdata:
